<svg viewBox="0 0 1200 620" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1200" height="620" fill="#0A0D12"/>
  <text x="600" y="42" text-anchor="middle" fill="#E15A4F" font-size="22" font-weight="700">MLPSAPS — Request Flow Architecture</text>

  <!-- main flow boxes -->
  <g font-size="13" fill="#DCE3EC">
    <!-- 1 Registration -->
    <rect x="30" y="100" width="150" height="70" rx="8" fill="#161B24" stroke="#232A36"/>
    <text x="105" y="130" text-anchor="middle" font-weight="600">Registration</text>
    <text x="105" y="150" text-anchor="middle" fill="#7E8AA0" font-size="11">POST /auth/register</text>

    <!-- 2 Hashing -->
    <rect x="220" y="100" width="150" height="70" rx="8" fill="#161B24" stroke="#232A36"/>
    <text x="295" y="125" text-anchor="middle" font-weight="600">Password</text>
    <text x="295" y="141" text-anchor="middle" font-weight="600">Hashing</text>
    <text x="295" y="158" text-anchor="middle" fill="#7E8AA0" font-size="11">bcrypt + salt</text>

    <!-- 3 Login Attempt -->
    <rect x="410" y="100" width="150" height="70" rx="8" fill="#161B24" stroke="#232A36"/>
    <text x="485" y="130" text-anchor="middle" font-weight="600">Login Attempt</text>
    <text x="485" y="150" text-anchor="middle" fill="#7E8AA0" font-size="11">POST /auth/login</text>

    <!-- 4 Lockout Check -->
    <rect x="600" y="100" width="150" height="70" rx="8" fill="#161B24" stroke="#232A36"/>
    <text x="675" y="125" text-anchor="middle" font-weight="600">Lockout</text>
    <text x="675" y="141" text-anchor="middle" font-weight="600">Check</text>
    <text x="675" y="158" text-anchor="middle" fill="#7E8AA0" font-size="11">adaptive backoff</text>

    <!-- 5 Policy check -->
    <rect x="790" y="100" width="150" height="70" rx="8" fill="#161B24" stroke="#232A36"/>
    <text x="865" y="125" text-anchor="middle" font-weight="600">Password Policy</text>
    <text x="865" y="141" text-anchor="middle" font-weight="600">+ Rate Limit</text>
    <text x="865" y="158" text-anchor="middle" fill="#7E8AA0" font-size="11">per-IP limiter</text>

    <!-- 6 MFA -->
    <rect x="980" y="100" width="190" height="70" rx="8" fill="#161B24" stroke="#232A36"/>
    <text x="1075" y="125" text-anchor="middle" font-weight="600">MFA (TOTP)</text>
    <text x="1075" y="141" text-anchor="middle" font-weight="600">Verification</text>
    <text x="1075" y="158" text-anchor="middle" fill="#7E8AA0" font-size="11">pre-MFA token → full session</text>

    <!-- 7 Session -->
    <rect x="600" y="260" width="150" height="70" rx="8" fill="#161B24" stroke="#4FBE8A"/>
    <text x="675" y="285" text-anchor="middle" font-weight="600" fill="#8DDBB4">JWT Session</text>
    <text x="675" y="305" text-anchor="middle" fill="#7E8AA0" font-size="11">access token issued</text>

    <!-- 8 Refresh -->
    <rect x="790" y="260" width="150" height="70" rx="8" fill="#161B24" stroke="#4FBE8A"/>
    <text x="865" y="285" text-anchor="middle" font-weight="600" fill="#8DDBB4">Refresh Token</text>
    <text x="865" y="305" text-anchor="middle" fill="#7E8AA0" font-size="11">/auth/refresh</text>

    <!-- Manual unlock -->
    <rect x="410" y="260" width="150" height="70" rx="8" fill="#161B24" stroke="#E0A63C"/>
    <text x="485" y="285" text-anchor="middle" font-weight="600" fill="#EFC57C">Admin Unlock</text>
    <text x="485" y="305" text-anchor="middle" fill="#7E8AA0" font-size="11">manual override</text>

    <!-- Audit logger spanning bottom -->
    <rect x="30" y="430" width="1140" height="90" rx="10" fill="#10141B" stroke="#E15A4F" stroke-dasharray="4 3"/>
    <text x="600" y="460" text-anchor="middle" font-weight="700" fill="#EE9088" font-size="15">Append-Only Audit Log</text>
    <text x="600" y="482" text-anchor="middle" fill="#7E8AA0" font-size="12">Every stage above writes here: registrations, login success/fail, lockouts, MFA events, password changes, admin actions</text>
    <text x="600" y="500" text-anchor="middle" fill="#7E8AA0" font-size="12">→ feeds the Admin Security Dashboard (stats, audit table, login attempts, lockouts)</text>
  </g>

  <!-- arrows main row -->
  <g stroke="#7E8AA0" stroke-width="2" marker-end="url(#arrow)">
    <line x1="180" y1="135" x2="218" y2="135"/>
    <line x1="370" y1="135" x2="408" y2="135"/>
    <line x1="560" y1="135" x2="598" y2="135"/>
    <line x1="750" y1="135" x2="788" y2="135"/>
    <line x1="940" y1="135" x2="978" y2="135"/>
  </g>

  <!-- down arrows to second row -->
  <g stroke="#7E8AA0" stroke-width="2" marker-end="url(#arrow)">
    <line x1="1075" y1="170" x2="1075" y2="220"/>
    <line x1="1075" y1="220" x2="865" y2="220"/>
    <line x1="865" y1="220" x2="865" y2="258"/>
    <line x1="750" y1="295" x2="788" y2="295"/>
    <line x1="560" y1="295" x2="598" y2="295"/>
  </g>

  <!-- dashed connectors from every top box down to audit log -->
  <g stroke="#E15A4F" stroke-width="1" stroke-dasharray="3 3" opacity="0.55">
    <line x1="105" y1="170" x2="105" y2="430"/>
    <line x1="295" y1="170" x2="295" y2="430"/>
    <line x1="485" y1="170" x2="485" y2="430"/>
    <line x1="675" y1="170" x2="675" y2="430"/>
    <line x1="865" y1="170" x2="865" y2="430"/>
    <line x1="1075" y1="170" x2="1075" y2="430"/>
    <line x1="675" y1="330" x2="675" y2="430"/>
    <line x1="865" y1="330" x2="865" y2="430"/>
    <line x1="485" y1="330" x2="485" y2="430"/>
  </g>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#7E8AA0"/>
    </marker>
  </defs>

  <text x="600" y="580" text-anchor="middle" fill="#7E8AA0" font-size="11">MLPSAPS — Multi-Layer Password Security &amp; Account Protection System</text>
</svg>
