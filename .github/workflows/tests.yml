name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest ruff

      # Only real errors (syntax errors, undefined names) -- not style --
      # so this can't fail on formatting preferences.
      - name: Lint
        run: ruff check --select E9,F63,F7,F82 app tests storefront config.py run.py locustfile.py

      # HIBP is mocked in the test suite, so no network access is needed.
      - name: Run tests
        run: python -m pytest -q
